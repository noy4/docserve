# Publishes the CLI (@noy4/docserve) to npm via trusted publishing.
#
# npmjs.com → @noy4/docserve → Settings → Trusted Publishing must list this
# exact filename. OIDC replaces NPM_TOKEN entirely; provenance is attached
# automatically. The unscoped "docserve" name is taken, hence the scope.
name: publish-cli
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm test
        working-directory: cli
      - run: npm publish
        working-directory: cli
