    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });

      (function () { var tl = window.__timelines["main"];

        tl.fromTo("#el-03-pick", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.out" }, 10.4);

        tl.fromTo("#el-04-livereload", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 16);
        tl.addLabel("hf:transition:03-pick:04-livereload:crossfade", 16);
        tl.to("#el-04-livereload", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 21.4);

        tl.to("#el-05-surfaces", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 28.1);
        tl.fromTo("#el-06-cta", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 28.1);
        tl.addLabel("hf:transition:05-surfaces:06-cta:crossfade-settle", 28.1);
        // end: hold the card after the VO, then dip to black as the BGM fades
        // end: the staged exit lives in 06-cta's own timeline (badge → pill → lockup → black veil, 32.1–33.0)
        tl.to({}, { duration: 33 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
