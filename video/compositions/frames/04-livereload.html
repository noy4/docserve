<script>
var tl = gsap.timeline({ paused: true });

// the couple establishes in one beat
tl.fromTo("#f04-editor", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.05);
tl.fromTo("#f04-page", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.13);
tl.fromTo(".f04-pcap", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.3);

// highlight sweep selects the headline value in the editor
var oldEl = document.getElementById("f04-old");
oldEl.style.position = "relative";
var hl = document.createElement("span");
hl.style.cssText = "position:absolute;inset:-2px -8px;background:rgba(68,101,219,0.32);border-radius:6px;transform:scaleX(0);transform-origin:left center;";
oldEl.appendChild(hl);
tl.to(hl, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 0.6);

// sweep-delete then retype (discrete text sequence + deterministic caret)
var newEl = document.getElementById("f04-new");
var caretEl = document.getElementById("f04-caret");
var RESOLVED = "Resolved";
var SEQ = [{ t: 1.0, text: "" }];
for (var i = 1; i <= RESOLVED.length; i++) SEQ.push({ t: 1.0 + i * 0.09, text: RESOLVED.substring(0, i) });
function textAt(time) {
  for (var j = SEQ.length - 1; j >= 0; j--) { if (time >= SEQ[j].t) return SEQ[j].text; }
  return "";
}
var driver = { t: 0 };
tl.to(driver, { t: 2.0, duration: 2.0, ease: "none", onUpdate: function () {
  newEl.textContent = textAt(driver.t);
}}, 0);
// caret: solid while typing, square-wave blink otherwise (pure function of time, runs to frame end)
var CHANGES = SEQ.slice(1).map(function (e) { return e.t; });
var blink = { p: 0 };
tl.to(blink, { p: Math.PI * 2 * 13.5, duration: 6.0, ease: "none", onUpdate: function () {
  var typing = false;
  for (var k = 0; k < CHANGES.length; k++) { if (driver.t >= CHANGES[k] && driver.t - CHANGES[k] < 0.15) { typing = true; break; } }
  caretEl.style.opacity = typing ? "1" : (Math.sin(blink.p) > 0 ? "1" : "0");
}}, 0);
// strike lands on the old value as the retype begins
tl.to(oldEl, { opacity: 0.55, duration: 0.2, ease: "power1.out" }, 1.0);

// "edited" chip presses in (subtle press-release)
tl.fromTo("#f04-chip", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 2.05);
tl.to("#f04-chip", { scale: 0.94, duration: 0.12, ease: "power1.in" }, 2.5);
tl.to("#f04-chip", { scale: 1, duration: 0.4, ease: "back.out(1.4)" }, 2.62);

// pulse line self-draws from editor to page (measured stroke)
var pulse = document.getElementById("f04-pulse");
pulse.style.left = "560px"; pulse.style.top = "380px"; pulse.style.width = "180px";
var ppath = document.getElementById("f04-pulsepath");
var len = ppath.getTotalLength();
ppath.style.strokeDasharray = String(len);
ppath.style.strokeDashoffset = String(len);
tl.to(ppath, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 2.55);
tl.fromTo("#f04-arrival", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.15, duration: 0.35, ease: "power2.out" }, 3.05);
tl.to("#f04-arrival", { opacity: 0, duration: 0.4, ease: "power2.in" }, 3.45);

// hard-cut swap on the page headline (orange → green) + quick flash
var headline = document.getElementById("f04-headline");
tl.set(headline, { color: "#4ade80" }, 3.2);
tl.set(headline.firstChild, { textContent: "Resolved" }, 3.2);
tl.fromTo("#f04-flash", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, 3.2);
tl.fromTo(headline, { scale: 1.03 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 3.2);

// landing line lands as one beat with the retype — the green swap stays the sole focal event
var ws = document.querySelectorAll("#root .f04-line .w");
ws.forEach(function (el, i) {
  tl.fromTo(el, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.7 + i * 0.12);
});

window.__timelines["04-livereload"] = tl;
</script>
