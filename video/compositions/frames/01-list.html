<script>
var tl = gsap.timeline({ paused: true });

// panel fades in with the first row — no empty box at t=0
tl.fromTo("#f01-listpanel", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.05);

// rows slide in one per beat (deterministic stagger)
var rows = document.querySelectorAll("#f01-listpanel .f01-row");
rows.forEach(function (el, i) {
  tl.fromTo(el,
    { x: -40, opacity: 0 },
    { x: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
    0.15 + i * 0.11
  );
});


// hook line lands per word on the beat
var l1 = document.querySelectorAll("#root .f01-headline div:first-child .w");
l1.forEach(function (el, i) {
  tl.fromTo(el, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.4 + i * 0.13);
});
var l2 = document.querySelectorAll("#root .f01-headline div:last-child .w");
l2.forEach(function (el, i) {
  tl.fromTo(el, { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.6 + i * 0.12);
});

// trailing echo line
tl.fromTo("#f01-sub", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 3.1);

window.__timelines["01-list"] = tl;
</script>
